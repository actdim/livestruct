name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'pnpm-workspace.yaml'
      - 'demo/**'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - id: pages
        uses: actions/configure-pages@v5

      # The package devDependencies include @actdim siblings that may not be on npm yet,
      # so the docs build does not depend on the workspace install. The docs only need VitePress.
      - name: Install docs toolchain
        run: |
          TOOLS="$RUNNER_TEMP/docs-tools"
          mkdir -p "$TOOLS"
          cd "$TOOLS"
          npm init -y > /dev/null
          npm install --no-audit --no-fund vitepress@^1.6.4 vitepress-plugin-mermaid@^2.0.17 mermaid@^11.4.1
          ln -s "$TOOLS/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Copy root files to public
        run: |
          mkdir -p docs/public
          cp -f llms.txt docs/public/llms.txt 2>/dev/null || true
          cp -f llms-full.txt docs/public/llms-full.txt 2>/dev/null || true

      - name: Build documentation
        run: node_modules/.bin/vitepress build docs

      # The demo (demo/) links this library from the folder and takes the other @actdim packages
      # from npm. Until they are published at the required version this step fails and the docs
      # deploy without the demo.
      - name: Build demo
        continue-on-error: true
        env:
          DEMO_BASE: ${{ steps.pages.outputs.base_path }}/demo/
        run: |
          rm -f node_modules
          pnpm install --no-frozen-lockfile
          pnpm run build
          pnpm --filter @actdim/livestruct-demo build
          cp -r demo/dist .dist-docs/demo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .dist-docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
